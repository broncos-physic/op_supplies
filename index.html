<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Bin Lookup</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --fg: #16202a;
      --mut: #667381;
      --card: #fff;
      --line: #d9dee4;
      --acc: #0b5cab;
      --accbg: #e4eefa;
      --hl: #fff1a8;
      --k0: #0b5cab;
      --k1: #1b7f3b;
      --k2: #b0246f;
      --k3: #0e7490;
      --k4: #7a3db8;
      --k5: #c2410c;
      --k6: #a16207;
      --k7: #be123c;
      --k8: #475569;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12171c;
        --fg: #e8edf2;
        --mut: #93a0ad;
        --card: #1b222a;
        --line: #2e3843;
        --acc: #6db1ff;
        --accbg: #1f3550;
        --hl: #6b5a00;
        --k0: #6db1ff;
        --k1: #5fd08a;
        --k2: #f58ac4;
        --k3: #5ad1e8;
        --k4: #c4a0f5;
        --k5: #ff9a6b;
        --k6: #f0c14b;
        --k7: #fb7185;
        --k8: #94a3b8;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 8px;
    }

    #q {
      width: 100%;
      font-size: 1.1rem;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
    }

    #q:focus {
      outline: none;
      border-color: var(--acc);
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chips button {
      font: inherit;
      font-size: .9rem;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
    }

    .chips button[aria-pressed=true] {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      .chips button[aria-pressed=true] {
        color: #06121f;
      }
    }

    #count {
      color: var(--mut);
      font-size: .85rem;
      margin-top: 6px;
    }

    main {
      padding: 12px 16px 40px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--accbg);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      font-size: .9rem;
    }

    th[aria-sort=ascending]::after {
      content: " \25B2";
      font-size: .7em;
    }

    th[aria-sort=descending]::after {
      content: " \25BC";
      font-size: .7em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.bin {
      white-space: nowrap;
    }

    .b {
      display: inline-block;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 2px 9px;
      border-radius: 6px;
      color: var(--c);
      background: color-mix(in srgb, var(--c) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    }

    .dot {
      display: inline-block;
      width: .65em;
      height: .65em;
      border-radius: 50%;
      background: var(--c);
      margin-right: 6px;
    }

    th.w {
      white-space: normal;
      min-width: 110px;
    }

    td.rf {
      font-family: ui-monospace, Consolas, monospace;
      font-size: .9rem;
    }

    td.cat {
      color: var(--mut);
      font-size: .85rem;
      white-space: nowrap;
    }

    .none {
      color: var(--mut);
    }

    mark {
      background: var(--hl);
      color: inherit;
      border-radius: 2px;
    }

    #empty {
      display: none;
      padding: 24px;
      text-align: center;
      color: var(--mut);
    }
  </style>
</head>
<body>
  <header>
    <h1>Supply bin lookup</h1>
    <input id="q" type="search" placeholder="Search name, size, Ref #, or bin (e.g. W 14, allevyn, 4in)" autofocus autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="count"></div>
  </header>

    <div class="wrap">

        <thead>

            <th data-k="3">Product</th>
            <th data-k="4">Size</th>
            <th data-k="5">Ref #</th>
            <th data-k="6" class="w">Til (Target Inventory Level)</th>
            <th data-k="7" class="w">Qty to dispense 30d/s</th>
            <th data-k="0">Category</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div id="empty">No matches. Try fewer words or a different spelling.</div>
    </div>
  </main>

    const CATS = ["All", ...new Set(DATA.map(r => r[0]))];
    const ci = c => CATS.indexOf(c) - 1;
    let cat = "All", sortK = null, sortDir = 1;
    const $ = id => document.getElementById(id);
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const nat = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });

    function hl(s, terms) {
      let h = esc(s);
      terms.forEach(t => {
        if (t) h = h.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
      });
      return h;
    }

    function render() {
      const terms = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
      let rows = DATA.filter(r => (cat === "All" || r[0] === cat) && terms.every(t => r.join(" ").toLowerCase().includes(t)));
      if (sortK !== null) rows = [...rows].sort((a, b) => sortDir * nat(a[sortK], b[sortK]));
      const cell = (v, terms) => v ? hl(v, terms) : '<span class="none">—</span>';
      $("tb").innerHTML = rows.map(r => `
        <tr>
          <td>${hl(r[1], terms)}</td>
          <td class="bin">${r[2] ? `<span class="b" style="--c:var(--k${ci(r[0])})">${hl(r[2], terms)}</span>` : '<span class="none">—</span>'}</td>
          <td>${cell(r[3], terms)}</td>
          <td>${cell(r[4], terms)}</td>
          <td class="rf">${cell(r[5], terms)}</td>
          <td>${hl(r[6], terms)}</td>
          <td>${hl(r[7], terms)}</td>
          <td class="cat">${esc(r[0])}</td>
        </tr>`).join("");
      $("empty").style.display = rows.length ? "none" : "block";
      $("count").textContent = rows.length + " of " + DATA.length + " items";
    }

    $("chips").innerHTML = CATS.map(c =>
      `<button aria-pressed="${c === "All"}">${c === "All" ? "" : `<span class="dot" style="--c:var(--k${ci(c)})"></span>`}${c}</button>`
    ).join("");

    $("chips").onclick = e => {
      if (e.target.tagName !== "BUTTON") return;
      cat = e.target.textContent;
      [...$("chips").children].forEach(b => b.setAttribute("aria-pressed", b === e.target));
      render();
    };

    document.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = +th.dataset.k;
      sortDir = sortK === k ? -sortDir : 1;
      sortK = k;
      document.querySelectorAll("th").forEach(x => x.removeAttribute("aria-sort"));
      th.setAttribute("aria-sort", sortDir > 0 ? "ascending" : "descending");
      render();
    });

    $("q").addEventListener("input", render);
    render();
  </script>
