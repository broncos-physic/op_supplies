<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply Bin Lookup</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --fg: #16202a;
      --mut: #667381;
      --card: #fff;
      --line: #d9dee4;
      --acc: #0b5cab;
      --accbg: #e4eefa;
      --hl: #fff1a8;
      --k0: #0b5cab;
      --k1: #1b7f3b;
      --k2: #b0246f;
      --k3: #0e7490;
      --k4: #7a3db8;
      --k5: #c2410c;
      --k6: #a16207;
      --k7: #be123c;
      --k8: #475569;
      --f-ret: #b45309;
      --f-lock: #6d28d9;
      --f-sub: #0f766e;
      --f-shr: #1d4ed8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12171c;
        --fg: #e8edf2;
        --mut: #93a0ad;
        --card: #1b222a;
        --line: #2e3843;
        --acc: #6db1ff;
        --accbg: #1f3550;
        --hl: #6b5a00;
        --k0: #6db1ff;
        --k1: #5fd08a;
        --k2: #f58ac4;
        --k3: #5ad1e8;
        --k4: #c4a0f5;
        --k5: #ff9a6b;
        --k6: #f0c14b;
        --k7: #fb7185;
        --k8: #94a3b8;
        --f-ret: #fbbf24;
        --f-lock: #c4b5fd;
        --f-sub: #5eead4;
        --f-shr: #93c5fd;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0 0 8px;
    }

    #q {
      width: 100%;
      font-size: 1.1rem;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
    }

    #q:focus {
      outline: none;
      border-color: var(--acc);
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chips button {
      font: inherit;
      font-size: .9rem;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
    }

    .chips button[aria-pressed=true] {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      .chips button[aria-pressed=true] {
        color: #06121f;
      }
    }

    #count {
      color: var(--mut);
      font-size: .85rem;
      margin-top: 6px;
    }

    main {
      padding: 12px 16px 12px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .wrap {
      overflow: auto;
      max-height: calc(100dvh - var(--hh, 170px) - 26px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      text-align: left;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--accbg);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      font-size: .9rem;
    }

    th[aria-sort=ascending]::after {
      content: " \25B2";
      font-size: .7em;
    }

    th[aria-sort=descending]::after {
      content: " \25BC";
      font-size: .7em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.bin {
      white-space: nowrap;
    }

    .b {
      display: inline-block;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 2px 9px;
      border-radius: 6px;
      color: var(--c);
      background: color-mix(in srgb, var(--c) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    }

    .dot {
      display: inline-block;
      width: .65em;
      height: .65em;
      border-radius: 50%;
      background: var(--c);
      margin-right: 6px;
    }

    td.rf {
      font-family: ui-monospace, Consolas, monospace;
      font-size: .9rem;
    }

    td.cat {
      color: var(--mut);
      font-size: .85rem;
      white-space: nowrap;
    }

    .none {
      color: var(--mut);
    }

    mark {
      background: var(--hl);
      color: inherit;
      border-radius: 2px;
    }

    th.x, td.x {
      width: 34px;
      padding-left: 8px;
      padding-right: 0;
    }

    tr.main {
      cursor: pointer;
    }

    tr.main:hover td {
      background: color-mix(in srgb, var(--acc) 5%, transparent);
    }

    tr.open td,
    tr.sub td {
      border-bottom-color: transparent;
    }

    tr.names td.narrow {
      display: none;
    }

    td.st .flags {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .flag {
      --c: var(--mut);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font: inherit;
      font-size: .72rem;
      font-weight: 600;
      line-height: 1;
      padding: 3px 7px 3px 5px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      background: color-mix(in srgb, var(--c) 12%, transparent);
      color: var(--c);
      cursor: help;
      white-space: nowrap;
    }

    .flag svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .f-ret { --c: var(--f-ret); }
    .f-lock { --c: var(--f-lock); }
    .f-sub { --c: var(--f-sub); }
    .f-shr { --c: var(--f-shr); }

    .pub {
      display: flex;
      gap: 5px;
      align-items: flex-start;
      margin-top: 4px;
      font-size: .82rem;
      color: var(--mut);
    }

    .pub svg {
      flex: none;
      width: 14px;
      height: 14px;
      margin-top: 1px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
    }

    .tip {
      position: fixed;
      z-index: 10;
      max-width: min(300px, calc(100vw - 16px));
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--fg);
      color: var(--bg);
      font-size: .82rem;
      line-height: 1.35;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
      pointer-events: none;
    }

    .stack + .stack {
      margin-top: 6px;
    }

    .mono {
      font-family: ui-monospace, Consolas, monospace;
    }

    @media (max-width: 640px), (max-height: 500px) {
      tr.names td.wide {
        display: none;
      }

      .flag {
        padding: 3px 5px;
      }

      .flag .fl {
        display: none;
      }

      td.st {
        padding-left: 4px;
        padding-right: 4px;
      }

      tr.names td.narrow {
        display: table-cell;
      }

      tr.names td.narrow .stack {
        max-width: calc(100vw - 130px);
        overflow-wrap: anywhere;
      }
    }

    tr.names.mid td {
      border-bottom-color: transparent;
      padding-bottom: 4px;
    }

    tr.names + tr.det td {
      padding-top: 4px;
    }

    .chev {
      font: inherit;
      width: 26px;
      height: 26px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--mut);
      cursor: pointer;
      padding: 0;
    }

    .chev svg {
      width: 14px;
      height: 14px;
      transition: transform .15s;
    }

    tr.open .chev {
      color: var(--acc);
      border-color: var(--acc);
    }

    tr.open .chev svg {
      transform: rotate(180deg);
    }

    tr.det td {
      background: color-mix(in srgb, var(--accbg) 55%, var(--card));
      font-size: .9rem;
      padding-top: 6px;
      padding-bottom: 12px;
    }

    .lbl {
      display: block;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--mut);
      margin-bottom: 2px;
    }

    .diff {
      display: block;
      font-size: .78rem;
      color: var(--mut);
      margin-top: 2px;
    }

    #tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    #tools #count {
      margin-top: 0;
    }

    #all {
      font: inherit;
      font-size: .85rem;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #tog {
      display: none;
    }

    @media (max-width: 640px), (max-height: 500px) {
      header {
        padding: 8px 12px;
      }

      h1 {
        margin: 0;
        font-size: 1.05rem;
      }

      main {
        padding: 8px 8px 8px;
      }

      #tog {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: inherit;
        font-size: .85rem;
        min-height: 36px;
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }

      #tog svg {
        width: 16px;
        height: 16px;
      }

      #tog.on {
        border-color: var(--acc);
        color: var(--acc);
      }

      #sum {
        color: var(--mut);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 50vw;
      }

      #tog.on #sum {
        color: var(--acc);
      }

      #panel {
        display: none;
        margin-top: 8px;
      }

      header.open #panel {
        display: block;
      }
    }

    /* Phones (portrait or landscape): each item becomes a card, no sideways scrolling.
       Line 1: chevron, bin, product, status icons. Below: fields across the full width. */
    @media (max-width: 640px), (max-height: 500px) {
      .wrap table,
      .wrap tbody {
        display: block;
      }

      .wrap thead {
        display: none;
      }

      #tb tr {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      #tb tr:last-child {
        border-bottom: 0;
      }

      #tb td {
        display: block;
        padding: 0;
        border: 0;
        background: none;
        min-width: 0;
      }

      #tb tr.main:hover {
        background: color-mix(in srgb, var(--acc) 5%, transparent);
      }

      #tb tr.main:hover td {
        background: none;
      }

      #tb tr.sub,
      #tb tr.open,
      #tb tr.names.mid {
        border-bottom-color: transparent;
      }

      #tb td.e,
      #tb td.cat,
      #tb tr.names td:not(.narrow) {
        display: none;
      }

      #tb td.x {
        width: auto;
        flex: none;
      }

      #tb td.bin {
        flex: none;
      }

      #tb td.prod {
        flex: 1 1 0;
        font-weight: 500;
      }

      #tb td.prod .pub {
        font-weight: 400;
      }

      #tb td.st {
        flex: none;
      }

      #tb td.st:empty {
        display: none;
      }

      #tb td.st .flags {
        flex-direction: row;
      }

      /* invisible full-width break so the fields always start below line 1 */
      #tb tr.main::after {
        content: "";
        order: 5;
        flex-basis: 100%;
      }

      /* fields: two per line */
      #tb td.sz,
      #tb td.rf,
      #tb td.tl,
      #tb td.qt,
      #tb td.ap,
      #tb td.sm {
        order: 6;
        flex: 0 0 calc(50% - 5px);
        align-self: flex-start;
        margin-top: 8px;
      }

      #tb td.rat {
        margin-top: 0;
      }

      #tb td.rat,
      #tb tr.names td.narrow {
        flex: 1 0 100%;
      }

      #tb td[data-l]::before {
        content: attr(data-l);
        display: block;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: .68rem;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--mut);
        margin-bottom: 1px;
      }

      #tb tr.det {
        background: color-mix(in srgb, var(--accbg) 55%, var(--card));
        font-size: .9rem;
      }

      #tb tr.names td.narrow {
        display: block;
      }

      #tb tr.names td.narrow .stack {
        max-width: none;
      }

      #tb tr.names.mid {
        padding-bottom: 8px;
      }

      #tb tr.names.mid + tr.det {
        padding-top: 2px;
      }
    }

    /* Phone landscape: all four fields on one line */
    @media (max-height: 500px) and (min-width: 641px) {
      #tb td.sz,
      #tb td.rf,
      #tb td.tl,
      #tb td.qt {
        flex-basis: calc(25% - 7.5px);
      }

      #tb tr.names td.narrow {
        display: flex;
        gap: 10px;
      }

      #tb tr.names td.narrow .stack:first-child {
        flex: 0 0 calc(25% - 7.5px);
      }

      #tb tr.names td.narrow .stack + .stack {
        margin-top: 0;
        flex: 1;
      }
    }

    #empty {
      display: none;
      padding: 24px;
      text-align: center;
      color: var(--mut);
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Supply bin lookup</h1>
      <button id="tog" type="button" aria-expanded="false" aria-controls="panel" aria-label="Search and filter">
        <span id="sum"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="panel">
    <input id="q" type="search" placeholder="Search name, size, Ref #, CMOP ID, bin, or badge (e.g. W 14, allevyn, XV080, retiring)" autofocus autocomplete="off">
    <div class="chips" id="chips"></div>
    <div id="tools">
      <div id="count"></div>
      <button id="all" type="button">Expand all</button>
    </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th class="x" aria-label="Details"></th>
            <th data-k="2">Bin</th>
            <th data-k="3">Product</th>
            <th data-k="st">Status</th>
            <th data-k="4">Size</th>
            <th data-k="5">Ref #</th>
            <th data-k="6" title="Enough for 3 patients for 7 days in whole dispensing units, and never less than the 30-day dispense quantity">Target Inventory Level</th>
            <th data-k="7">Qty to dispense for 30d/s</th>
            <th data-k="0">Category</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div id="empty">No matches. Try fewer words or a different spelling.</div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js"></script>
  <script>
    // Item data lives in data.xlsx (same folder), on the sheet named "Master" (or the first sheet if
    // there is none). Columns are matched by header name, so their order doesn't matter:
    //   category, bin, product name, size, ref, til, qty_30d, search_extra,
    //   assumed_pack, suggested_min, rationale, cmop id, mmr product name (shown as PowerChart name),
    //   public comments, and the TRUE/FALSE flags hidden, replacement, pending delete, pending flex on,
    //   shared bin
    // Rows with hidden = TRUE are left out. Any other column (internal comments, ScriptPro names, ...)
    // is ignored.
    // Keep ID columns formatted as Text in Excel so refs like 021712 keep their leading zero.
    // A new category needs its own --kN color above (categories are numbered in order of first appearance).

    // Row layout used by the page:
    //   0 category, 1 (unused), 2 bin, 3 product, 4 size, 5 ref, 6 til, 7 qty_30d, 8 search_extra,
    //   9 assumed_pack, 10 suggested_min, 11 rationale, 12 cmop id, 13 PowerChart name, 14 public comments,
    //   15 hidden, 16 replacement, 17 pending delete, 18 pending flex on, 19 shared bin
    const COLS = [
      ["category"], ["shelf"], ["bin"], ["product name", "product"], ["size"], ["ref", "ref #"],
      ["til", "target inventory level"], ["qty_30d"], ["search_extra"],
      ["assumed_pack"], ["suggested_min"], ["rationale"],
      ["cmop id", "cmop"], ["mmr product name", "powerchart product name", "mmr name"], ["public comments", "public comment"],
      ["hidden"], ["replacement"], ["pending delete"], ["pending flex on"], ["shared bin"]
    ];
    const yes = v => /^(true|yes|y|x|1)$/i.test(v);

    function toData(buf) {
      const wb = XLSX.read(buf, { type: "array" });
      const name = wb.SheetNames.find(n => n.trim().toLowerCase() === "master") || wb.SheetNames[0];
      // raw:false returns what Excel displays (TRUE/FALSE for checkboxes, "70%" for a percent)
      const [hdr, ...body] = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: "", blankrows: false });
      const norm = h => String(h).replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
      const H = hdr.map(norm);
      const pos = COLS.map(names => H.findIndex(h => names.includes(h)));
      const val = (r, p) => (p < 0 ? "" : String(r[p] ?? "")).replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
      return body
        .map(r => pos.map(p => val(r, p)))
        .filter(r => (r[2] || r[3]) && !yes(r[15]));
    }

    const FLAGS = [
      { i: 17, cls: "ret", label: "Retiring",
        tip: "Retiring: this item will be discontinued once the pharmacy has used up its stock on hand.",
        icon: '<path d="M4 2h8M4 14h8M5 2v1.6c0 2 3 2.9 3 4.4S5 10.4 5 12.4V14M11 2v1.6c0 2-3 2.9-3 4.4s3 2.4 3 4.4V14"/><path d="M6.4 12.6h3.2L8 10.9z" fill="currentColor" stroke="none"/>' },
      { i: 18, cls: "lock", label: "Pending setup",
        tip: "Pending setup: this item can't be ordered yet. It still needs to be added to the prescribing system.",
        icon: '<rect x="3.5" y="7" width="9" height="6.5" rx="1.2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>' },
      { i: 16, cls: "sub", label: "Replacement",
        tip: "Replacement: the item dispensed is an equivalent product from a different brand than the one prescribed.",
        icon: '<path d="M3 5.5h9.5M10 3l2.5 2.5L10 8M13 10.5H3.5M6 8l-2.5 2.5L6 13"/>' },
      { i: 19, cls: "shr", label: "Shared bin",
        tip: "Shared bin: this bin holds more than one product. Check the size and label before dispensing.",
        icon: '<path d="M2.5 6.5h11v7h-11zM2.5 6.5l1.5-3h8l1.5 3M8 6.5v7"/>' }
    ];
    const flagText = r => FLAGS.filter(f => yes(r[f.i])).map(f => f.label).join(" ");

    function fail(msg) {
      document.getElementById("count").textContent = msg;
      document.getElementById("sum").textContent = msg;
    }

    if (!window.XLSX) fail("Couldn't load the spreadsheet reader. Check the connection and reload.");
    else fetch("data.xlsx", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.arrayBuffer(); })
      .then(buf => start(toData(buf)))
      .catch(e => fail("Couldn't load data.xlsx (" + e.message + ")."));

    function start(DATA) {

      DATA.forEach(r => r.st = flagText(r));
      DATA.forEach(r => r.hay = r.slice(0, 9).concat(r.slice(12, 15), flagText(r)).join(" ").toLowerCase());
      const CATS = ["All", ...new Set(DATA.map(r => r[0]))];
      const ci = c => CATS.indexOf(c) - 1;
      let cat = "All", sortK = null, sortDir = 1;
      const $ = id => document.getElementById(id);
      const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const nat = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });

      function hl(s, terms) {
        let h = esc(s);
        terms.forEach(t => {
          if (t) h = h.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
        });
        return h;
      }

      const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const open = new Set();
    const INFO = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.9v.1"/></svg>';
      DATA.forEach((r, i) => r.id = i);

      function render() {
        unpin();
        const terms = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
        let rows = DATA.filter(r => (cat === "All" || r[0] === cat) && terms.every(t => r.hay.includes(t)));
        if (sortK !== null) rows = [...rows].sort((a, b) =>
          sortK === "st" && !a.st !== !b.st ? (a.st ? -1 : 1) : sortDir * nat(a[sortK], b[sortK]));
        const cell = (v, terms) => v ? hl(v, terms) : '<span class="none">—</span>';
        const badges = r => {
          const on = FLAGS.filter(f => yes(r[f.i]));
          return on.length ? `<span class="flags">${on.map(f =>
            `<button type="button" class="flag f-${f.cls}" data-tip="${esc(f.tip)}" aria-label="${esc(f.tip)}"><svg viewBox="0 0 16 16" aria-hidden="true">${f.icon}</svg><span class="fl">${hl(f.label, terms)}</span></button>`
          ).join("")}</span>` : "";
        };
        const names = (r, mid) => `
          <tr class="det names${mid ? " mid" : ""}">
            <td class="x e"></td>
            <td class="e"></td>
            <td class="wide" colspan="3"><span class="lbl">PowerChart product name</span>${cell(r[13], terms)}</td>
            <td class="wide rf"><span class="lbl">CMOP ID</span>${cell(r[12], terms)}</td>
            <td class="wide" colspan="3"></td>
            <td class="narrow" colspan="7">
              <div class="stack"><span class="lbl">CMOP ID</span><span class="mono">${cell(r[12], terms)}</span></div>
              <div class="stack"><span class="lbl">PowerChart product name</span>${cell(r[13], terms)}</div>
            </td>
          </tr>`;
        const det = r => {
          const sug = r[10] || "", til = r[6] || "";
          const sugCell = sug && sug !== til
            ? `${esc(sug)}<span class="diff">Current: ${esc(til || "—")}</span>`
            : (sug ? esc(sug) : '<span class="none">—</span>');
          return `
          <tr class="det rat-row" id="d${r.id}">
            <td class="x e"></td>
            <td class="e"></td>
            <td class="rat" colspan="3"><span class="lbl">Rationale</span>${r[11] ? esc(r[11]) : '<span class="none">—</span>'}</td>
            <td class="ap"><span class="lbl">Assumed pack</span>${r[9] ? esc(r[9]) : '<span class="none">—</span>'}</td>
            <td class="sm"><span class="lbl">Suggested min</span>${sugCell}</td>
            <td class="e"></td>
            <td class="e"></td>
          </tr>`;
        };
        $("tb").innerHTML = rows.map(r => {
          const o = open.has(r.id), n = o || terms.length > 0;
          return `
          <tr class="main${o ? " open" : ""}${n ? " sub" : ""}" data-id="${r.id}">
            <td class="x"><button class="chev" type="button" aria-expanded="${o}" aria-controls="d${r.id}" aria-label="${o ? "Hide" : "Show"} details">${CHEV}</button></td>
            <td class="bin">${r[2] ? `<span class="b" style="--c:var(--k${ci(r[0])})">${hl(r[2], terms)}</span>` : '<span class="none">—</span>'}</td>
            <td class="prod">${cell(r[3], terms)}${r[14] ? `<span class="pub">${INFO}<span>${hl(r[14], terms)}</span></span>` : ""}</td>
            <td class="st">${badges(r)}</td>
            <td class="sz" data-l="Size">${cell(r[4], terms)}</td>
            <td class="rf" data-l="Ref #">${cell(r[5], terms)}</td>
            <td class="tl" data-l="Target inventory">${cell(r[6], terms)}</td>
            <td class="qt" data-l="Qty for 30 days">${cell(r[7], terms)}</td>
            <td class="cat">${esc(r[0])}</td>
          </tr>${n ? names(r, o) : ""}${o ? det(r) : ""}`;
        }).join("");
        $("empty").style.display = rows.length ? "none" : "block";
        $("count").textContent = rows.length + " of " + DATA.length + " items";
        const q = $("q").value.trim(), filtered = q || cat !== "All";
        $("sum").textContent = filtered ? [cat !== "All" ? cat : "", q ? "“" + q + "”" : ""].filter(Boolean).join(" · ") + " · " + rows.length : rows.length + " items";
        $("tog").classList.toggle("on", !!filtered);
        $("all").textContent = rows.length && rows.every(r => open.has(r.id)) ? "Collapse all" : "Expand all";
        shown = rows;
      }
      let shown = [];

      $("tb").onclick = e => {
        const fl = e.target.closest(".flag");
        if (fl) {
          e.stopPropagation();
          if (pinned === fl) { pinned = null; hideTip(); } else { pinned = fl; showTip(fl); }
          return;
        }
        const tr = e.target.closest("tr.main");
        if (!tr || (!e.target.closest(".chev") && String(getSelection()))) return;
        const id = +tr.dataset.id;
        open.has(id) ? open.delete(id) : open.add(id);
        render();
      };

      $("all").onclick = () => {
        const allOpen = shown.every(r => open.has(r.id));
        shown.forEach(r => allOpen ? open.delete(r.id) : open.add(r.id));
        render();
      };

      $("chips").innerHTML = CATS.map(c =>
        `<button aria-pressed="${c === "All"}">${c === "All" ? "" : `<span class="dot" style="--c:var(--k${ci(c)})"></span>`}${c}</button>`
      ).join("");

      $("tog").onclick = () => {
        const h = document.querySelector("header"), o = h.classList.toggle("open");
        $("tog").setAttribute("aria-expanded", o);
        if (o) $("q").focus();
      };
      $("q").addEventListener("keydown", e => {
        if (e.key === "Enter" && matchMedia("(max-width: 640px), (max-height: 500px)").matches) {
          $("q").blur();
          document.querySelector("header").classList.remove("open");
          $("tog").setAttribute("aria-expanded", false);
        }
      });

      $("chips").onclick = e => {
        if (e.target.tagName !== "BUTTON") return;
        cat = e.target.textContent;
        [...$("chips").children].forEach(b => b.setAttribute("aria-pressed", b === e.target));
        render();
      };

      document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
        const k = th.dataset.k === "st" ? "st" : +th.dataset.k;
        sortDir = sortK === k ? -sortDir : 1;
        sortK = k;
        document.querySelectorAll("th").forEach(x => x.removeAttribute("aria-sort"));
        th.setAttribute("aria-sort", sortDir > 0 ? "ascending" : "descending");
        render();
      });

      // one shared tooltip so it isn't clipped by the scrolling table
      let tipEl = null, tipFor = null, pinned = null;
      function showTip(el) {
        hideTip();
        tipEl = document.createElement("div");
        tipEl.className = "tip"; tipEl.setAttribute("role", "tooltip");
        tipEl.textContent = el.dataset.tip;
        document.body.appendChild(tipEl);
        const b = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
        let x = Math.min(Math.max(8, b.left + b.width / 2 - t.width / 2), innerWidth - t.width - 8);
        let y = b.top - t.height - 8;
        if (y < 8) y = b.bottom + 8;
        tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
        tipFor = el;
      }
      function hideTip() { if (tipEl) tipEl.remove(); tipEl = tipFor = null; }
      function unpin() { pinned = null; hideTip(); }
      $("tb").addEventListener("mouseover", e => { const f = e.target.closest(".flag"); if (f && f !== tipFor) showTip(f); });
      $("tb").addEventListener("mouseout", e => { const f = e.target.closest(".flag"); if (f && f !== pinned && !f.contains(e.relatedTarget)) hideTip(); });
      $("tb").addEventListener("focusin", e => { const f = e.target.closest(".flag"); if (f) showTip(f); });
      $("tb").addEventListener("focusout", e => { const f = e.target.closest(".flag"); if (f && f !== pinned) hideTip(); });
      document.addEventListener("click", e => { if (!e.target.closest(".flag")) unpin(); });
      document.querySelector(".wrap").addEventListener("scroll", () => {
        if (!tipFor) return;
        const w = document.querySelector(".wrap").getBoundingClientRect(), r = tipFor.getBoundingClientRect();
        if (r.bottom < w.top + 40 || r.top > w.bottom) unpin(); else showTip(tipFor);
      }, { passive: true });
      addEventListener("resize", unpin);

      $("q").addEventListener("input", render);
      const fit = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
      new ResizeObserver(fit).observe(document.querySelector("header"));
      fit();
      render();
    }
  </script>
</body>
</html>
